name: Validate software modules
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - run: python3 -m unittest discover -s tests -v
      - run: python3 tests/check_links.py
      - name: PHP permission and navigation behavior
        run: |
          php -v
          php tests/controller.php
          find homehub -name '*.php' -print0 | xargs -0 -n1 php -l
      - run: node --check homehub/js/hub.js
