name: Validate software modules
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python3 -m unittest discover -s tests -v
      - run: python3 tests/check_links.py
      - name: PHP permission and navigation behavior
        run: |
          php -v
          php tests/controller.php
          find homehub -name '*.php' -print0 | xargs -0 -n1 php -l
      - run: node --check homehub/js/hub.js
